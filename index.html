<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tu archivo de estilos corregido -->
    <link rel="stylesheet" href="stilo.css">
</head>
<body class="bg-gray-900 text-white font-sans flex flex-col items-center justify-center min-h-screen p-4">

    <div id="app" class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
        
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wider text-cyan-400">SISTEMA ASISTENCIA</h1>
            <p class="text-xs text-gray-400 mt-1">LURA</p>
        </header>

        <!-- PANTALLA 1: INICIO DE SESIÓN -->
        <div id="pantalla-login" class="space-y-6">
            <h2 class="text-xl font-semibold text-center text-gray-200">Ingreso de Personal</h2>
            
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Nombre o Código</label>
                    <input type="text" id="login-nombre" required placeholder="Ej. Pedro " 
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>

                <button type="submit" 
                    class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold py-3 rounded-lg shadow-lg hover:shadow-cyan-500/20 transition-all uppercase tracking-wider mt-2">
                    Entrar
                </button>
            </form>
            
            <div class="text-center pt-2">
                <button id="btn-ir-admin" class="text-xs text-cyan-400/70 hover:text-cyan-400 underline">
                    Acceso Administrador
                </button>
            </div>
        </div>

        <!-- PANTALLA 2: REGISTRO DE ASISTENCIA -->
        <div id="pantalla-asistencia" class="hidden space-y-6">
            <div class="text-center bg-gray-900/50 rounded-xl p-3 border border-gray-700/50">
                <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Día Actual</span>
                <div id="txt-fecha-hoy" class="text-xl font-bold text-cyan-400 mt-0.5">--/--</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="btn-entrada" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-2 rounded-xl shadow-lg transition-all flex flex-col items-center justify-center space-y-1">
                    <span class="text-2xl">🟢</span>
                    <span class="text-sm tracking-wide uppercase">Entrada</span>
                </button>
                <button id="btn-salida" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 px-2 rounded-xl shadow-lg transition-all flex flex-col items-center justify-center space-y-1 opacity-50 cursor-not-allowed" disabled>
                    <span class="text-2xl">🔴</span>
                    <span class="text-sm tracking-wide uppercase">Salida</span>
                </button>
            </div>

            <div class="bg-gray-900 rounded-xl p-4 border border-gray-700 space-y-3">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-700 pb-2">Reporte del Día</h3>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">Hora Entrada:</span>
                    <span id="rep-entrada" class="font-mono font-bold text-gray-200">--:-- Horas</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">Hora Salida:</span>
                    <span id="rep-salida" class="font-mono font-bold text-gray-200">--:-- Horas</span>
                </div>
                <div class="border-t border-gray-800 my-2 pt-2 flex justify-between items-center text-sm">
                    <span class="text-cyan-400 font-semibold">Total Horas:</span>
                    <span id="rep-total" class="font-bold text-cyan-400">0 Horas</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-amber-400 font-semibold">Hora Extra:</span>
                    <span id="rep-extra" class="font-bold text-amber-400">0 Horas</span>
                </div>
            </div>

            <button id="btn-logout" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 py-2 rounded-lg text-xs transition-colors">
                Cerrar Sesión
            </button>
        </div>

        <!-- PANTALLA 3: VISTA ADMINISTRADOR -->
        <div id="pantalla-admin" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h2 class="text-lg font-bold text-cyan-400">Panel Administrador</h2>
                <button id="btn-admin-salir" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-lg">Salir</button>
            </div>

            <form id="form-add-usuario" class="bg-gray-900 p-4 rounded-xl border border-gray-700 space-y-3">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Añadir Compañero</h3>
                <div>
                    <input type="text" id="add-nombre" required placeholder="Nombre Completo" 
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <input type="password" id="add-password" required placeholder="Contraseña" 
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500">
                </div>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold py-2 rounded-lg text-xs uppercase tracking-wider">
                    Añadir Usuario
                </button>
            </form>

            <div class="space-y-3">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Compañeros Registrados</h3>
                <div id="lista-usuarios-contenedor" class="space-y-2 max-h-32 overflow-y-auto pr-1"></div>
            </div>

            <div class="space-y-3 pt-2 border-t border-gray-700/50">
                <h3 class="text-xs font-bold text-amber-400 tracking-wider uppercase">Historial de Marcas</h3>
                <div id="lista-asistencias-admin" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </div>

    </div>

    <!-- CARGA DE TU LÓGICA -->
    <script src="app.js"></script>
</body>
</html>
